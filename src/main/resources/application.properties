spring.application.name=gerenciador_estoque
# ===============================
# DATASOURCE (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=("driver do banco de dados")

# ==============================
# DATASOURCE (SQLite)
# ==============================
#spring.datasource.url=jdbc:sqlite:database.db
#spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=com.diego_ramos.gerenciador_estoque.config.SQLiteDialect
# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ===============================
# SERVER
# ===============================
server.port=${SERVER_PORT:8080}
