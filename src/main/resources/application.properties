spring.application.name=gerenciador_estoque
# ===============================
# DATASOURCE (SQLite)
# ===============================
# SQLite DB file path (default: ./data/gerenciador.db)
spring.datasource.url=jdbc:sqlite:${SQLITE_DB_PATH:./data/gerenciador.db}
# SQLite doesn't require username/password but keep placeholders if needed
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.sqlite.JDBC
# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Use a custom SQLite dialect implemented in the project
spring.jpa.database-platform=com.diego_ramos.gerenciador_estoque.config.SQLiteDialect
# Automatically update the schema in development (change for production)
spring.jpa.hibernate.ddl-auto=update
# ===============================
# SERVER
# ===============================
server.port=${SERVER_PORT:8080}
