name: Block Secrets Commits

on:
  push:
    branches:
      - '**'   # todas as branches
  pull_request:
    branches:
      - '**'   # todas as branches

jobs:
  check-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Scan for sensitive files
        run: |
          # Lista todos os arquivos alterados no commit ou PR
          FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})

          # Define os padrões de arquivos sensíveis
          SENSITIVE_PATTERN="(^\.env$|^\.env\..*$|\.pem$|\.key$|config\.json$|credentials\.json$)"

          # Procura arquivos sensíveis
          if echo "$FILES" | grep -E "$SENSITIVE_PATTERN"; then
            echo "❌ Arquivos sensíveis detectados no commit!"
            echo "Remova arquivos como .env, .env.*, config.json, chaves .pem/.key antes de continuar."
            exit 1
          else
            echo "✅ Nenhum arquivo sensível detectado."
          fi