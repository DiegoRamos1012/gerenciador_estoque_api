name: Block Secrets Commits

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  check-secrets:
    runs-on: ubuntu-latest

    steps:
      # Faz checkout do código com histórico completo (opcional)
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # garante histórico completo, mas não obrigatório com ls-files

      # Checa arquivos sensíveis
      - name: Scan for sensitive files
        run: |
          echo "🔍 Verificando arquivos sensíveis..."
          SENSITIVE_PATTERN="^\.env$|^\.env\..*$|\.pem$|\.key$|config\.json$|credentials\.json$"
          
          # Procura arquivos no estado atual do repositório
          FILES=$(git ls-files | grep -E "$SENSITIVE_PATTERN" || true)

          if [ -n "$FILES" ]; then
            echo "❌ Arquivos sensíveis detectados no repositório:"
            echo "$FILES"
            echo "Remova esses arquivos ou adicione-os ao .gitignore antes de continuar."
            exit 1
          else
            echo "✅ Nenhum arquivo sensível detectado."
          fi